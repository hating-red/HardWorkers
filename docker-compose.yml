name: hardworkers

services:
  hardworkers:
    image: hardworkers:latest
    container_name: hardworkers
    build:
      context: .
      args:
        NUXT_PUBLIC_SITE_URL: "${NUXT_PUBLIC_SITE_URL:-https://trydiagin-perm.ru}"
        NUXT_PUBLIC_SITE_INDEXABLE: "${NUXT_PUBLIC_SITE_INDEXABLE:-true}"
        NUXT_PUBLIC_YANDEX_VERIFICATION: "${NUXT_PUBLIC_YANDEX_VERIFICATION:-}"
        NUXT_PUBLIC_GOOGLE_VERIFICATION: "${NUXT_PUBLIC_GOOGLE_VERIFICATION:-}"
        NUXT_PUBLIC_METRIKA_ID: "${NUXT_PUBLIC_METRIKA_ID:-}"
    # Заявки с сайта уходят в MAX; значения берутся из .env рядом с docker-compose.yml
    environment:
      NUXT_MAX_BOT_TOKEN: "${NUXT_MAX_BOT_TOKEN:-}"
      NUXT_MAX_USER_ID: "${NUXT_MAX_USER_ID:-}"
      NUXT_MAX_CHAT_ID: "${NUXT_MAX_CHAT_ID:-}"
    ports:
      - "127.0.0.1:2000:3000"
    restart: unless-stopped
